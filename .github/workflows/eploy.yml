
name: Deploy Blue Gem Frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build website
        working-directory: frontend
        env:
          # Optional. Set the repository variable VITE_API_URL (Settings ->
          # Secrets and variables -> Actions -> Variables) to a hosted backend and
          # accounts (login, cloud inventory) start working. Left unset the site
          # runs in guest mode: balance and inventory live in each visitor's
          # browser, and nothing calls localhost.
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        # `base` now lives in vite.config.js; --base is kept so the deployment
        # path stays explicit in the workflow as well.
        run: npm run build -- --base=/blue/

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
